#config for comfyui
# Models live on the Network Volume under /runpod-volume/models/<folder>/,
# which is where fetch_models.py puts them. The image's own folders stay first.

comfyui:
    base_path: /ComfyUI/
    is_default: true
    checkpoints: models/checkpoints/
    clip: models/clip/
    clip_vision: models/clip_vision/
    configs: models/configs/
    controlnet: models/controlnet/
    diffusion_models: |
        models/diffusion_models
        models/unet
        /runpod-volume/models/diffusion_models/
    text_encoders: |
        models/text_encoders/
        /runpod-volume/models/text_encoders/
    embeddings: models/embeddings/
    loras: |
        models/loras/
        /runpod-volume/models/loras/
        /runpod-volume/loras/
    upscale_models: models/upscale_models/
    vae: |
        models/vae/
        /runpod-volume/models/vae/
